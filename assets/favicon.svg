<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5EEFF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </radialGradient>
    <radialGradient id="body" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#9061F9"/>
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bg)" stroke="#DDD6FE" stroke-width="2"/>
  <!-- Wings -->
  <ellipse cx="28" cy="52" rx="14" ry="20" fill="rgba(196,168,255,0.5)" transform="rotate(-20,28,52)"/>
  <ellipse cx="72" cy="52" rx="14" ry="20" fill="rgba(196,168,255,0.5)" transform="rotate(20,72,52)"/>
  <!-- Body/dress -->
  <ellipse cx="50" cy="62" rx="14" ry="16" fill="#C084FC"/>
  <!-- Head -->
  <circle cx="50" cy="40" r="13" fill="#FFE4CC"/>
  <!-- Hair -->
  <ellipse cx="50" cy="32" rx="13" ry="9" fill="#C4B5FD"/>
  <ellipse cx="38" cy="42" rx="5" ry="10" fill="#C4B5FD"/>
  <ellipse cx="62" cy="42" rx="5" ry="10" fill="#C4B5FD"/>
  <!-- Crown -->
  <polygon points="43,28 47,22 50,26 53,22 57,28" fill="#FCD34D" stroke="#F59E0B" stroke-width="0.5"/>
  <!-- Eyes -->
  <circle cx="45" cy="40" r="2.5" fill="#4B1D8C"/>
  <circle cx="55" cy="40" r="2.5" fill="#4B1D8C"/>
  <circle cx="46" cy="39" r="0.8" fill="white"/>
  <circle cx="56" cy="39" r="0.8" fill="white"/>
  <!-- Blush -->
  <circle cx="41" cy="44" r="3" fill="rgba(244,114,182,0.4)"/>
  <circle cx="59" cy="44" r="3" fill="rgba(244,114,182,0.4)"/>
  <!-- Smile -->
  <path d="M46 46 Q50 49 54 46" stroke="#4B1D8C" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Wand -->
  <line x1="63" y1="55" x2="76" y2="42" stroke="#A78BFA" stroke-width="2" stroke-linecap="round"/>
  <!-- Wand star -->
  <text x="74" y="44" font-size="10" text-anchor="middle" dominant-baseline="middle">⭐</text>
  <!-- Sparkles -->
  <text x="22" y="30" font-size="9" opacity="0.8">✨</text>
  <text x="70" y="25" font-size="7" opacity="0.7">🌸</text>
  <text x="20" y="72" font-size="7" opacity="0.6">💜</text>
</svg>
