name: PrincessCycle Test Suite & Lint

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js for Headless Test Verification
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check all ES modules
        run: |
          for f in js/*.js sw.js; do
            node --check "$f"
          done
          echo "✅ All modules parse cleanly."

      - name: Run unit test suite (fails on any assertion failure)
        run: |
          node --input-type=module -e "
            const testMod = await import('./tests/cycle-engine.test.js');
            const results = await testMod.runAllTests();
            const passed = results.filter(r => r.passed).length;
            const total = results.length;
            console.log(\`✅ \${passed}/\${total} Unit Test Assertions Passed.\`);
            for (const f of results.filter(r => !r.passed)) {
              console.error('❌ FAIL:', f.testName, f.details || '');
            }
            if (passed !== total) process.exit(1);
          " || exit 1
